databases:
  - name: task-manager-db
    databaseName: task_manager
    user: task_manager_user
    plan: free

services:
  - type: web
    name: task-manager-tool
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: DATABASE_URL
        fromDatabase:
          name: task-manager-db
          property: connectionString
